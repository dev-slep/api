parameters:
    # Access tokens (signed with config/jwt, generated by `make jwt-keys`)
    auth.jwt.private_key_path: '%env(resolve:JWT_PRIVATE_KEY_PATH)%'
    auth.jwt.public_key_path: '%env(resolve:JWT_PUBLIC_KEY_PATH)%'
    auth.jwt.key_id: '%env(JWT_KEY_ID)%'
    auth.jwt.issuer: '%env(JWT_ISSUER)%'
    auth.jwt.audience: '%env(JWT_AUDIENCE)%'
    # Argon2id cost (the test environment lowers it)
    auth.argon2.memory_kib: 65536
    auth.argon2.time_cost: 4
    # Rate limits: attempts per window (tests lower them)
    auth.rate_limit.login_ip: 30
    auth.rate_limit.login_email: 5
    auth.rate_limit.register_ip: 20
    auth.rate_limit.password_ip: 10
    auth.rate_limit.password_email: 3
    auth.rate_limit.email_ip: 10
    auth.rate_limit.email_email: 3
    auth.rate_limit.social_ip: 30
    auth.rate_limit.token_ip: 20
    auth.rate_limit.two_factor_account: 5
    auth.rate_limit.two_factor_ip: 30

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Authentication\:
        resource: '../../src/Authentication/'
        exclude:
            - '../../src/Authentication/Domain/Model/'
            - '../../src/Authentication/Domain/Event/'
            - '../../src/Authentication/Domain/Exception/'
            - '../../src/Authentication/Contract/Dto/'
            - '../../src/Authentication/Contract/Event/'
            - '../../src/Authentication/Infrastructure/Persistence/Entity/'
            - '../../src/Authentication/Infrastructure/Http/Request/'
            - '../../src/Authentication/Infrastructure/Http/Response/'
            - '../../src/Authentication/Infrastructure/Security/AuthenticatedUser.php'
            - '../../src/Authentication/Infrastructure/Security/TokenAuthenticationException.php'
            - '../../src/Authentication/Application/Command/Result/'
            - '../../src/Authentication/Application/Command/RequestContext.php'
            - '../../src/Authentication/Application/Port/AuthenticationMethod.php'
            - '../../src/Authentication/Application/Port/IssuedAccessToken.php'
            - '../../src/Authentication/Application/Port/AuthenticatedPrincipal.php'
            - '../../src/Authentication/Application/Port/VerifiedSocialIdentity.php'
            - '../../src/Authentication/Application/Port/EmailDeliveryFailed.php'
            - '../../src/Authentication/Application/Port/SocialProviderUnavailable.php'
            - '../../src/Authentication/Infrastructure/Jwt/JwtSettings.php'
            - '../../src/Authentication/Infrastructure/Social/SocialProviderSettings.php'
            - '../../src/Authentication/Infrastructure/Social/RsaJwk.php'
            - '../../src/Authentication/Application/Command/{RegisterUser,Login,RefreshTokens,Logout,VerifyEmail,ResendEmailVerification,RequestPasswordReset,ResetPassword,SocialLogin,StartTwoFactorEnrolment,ConfirmTwoFactorEnrolment,VerifyTwoFactor,RevokeAllRefreshTokens,BanAccount,CreateAdmin,PurgeExpiredTokens}.php'

    # --- Ports with several implementations: the real ones are wired here ---
    App\Authentication\Domain\Repository\UserAccountRepository: '@App\Authentication\Infrastructure\Persistence\DoctrineUserAccountRepository'
    App\Authentication\Domain\Repository\RefreshTokenRepository: '@App\Authentication\Infrastructure\Persistence\DoctrineRefreshTokenRepository'
    App\Authentication\Domain\Repository\OneTimeTokenRepository: '@App\Authentication\Infrastructure\Persistence\DoctrineOneTimeTokenRepository'
    App\Authentication\Domain\Repository\TwoFactorSecretRepository: '@App\Authentication\Infrastructure\Persistence\DoctrineTwoFactorSecretRepository'
    App\Authentication\Application\Port\AccessTokenIssuer: '@App\Authentication\Infrastructure\Jwt\JwtAccessTokenIssuer'
    App\Authentication\Application\Port\AccessTokenVerifier: '@App\Authentication\Infrastructure\Jwt\JwtAccessTokenVerifier'
    App\Authentication\Application\Port\AuthEmailSender: '@App\Authentication\Infrastructure\Mail\SymfonyAuthEmailSender'
    App\Authentication\Application\Port\SocialIdentityVerifier: '@App\Authentication\Infrastructure\Social\JwksSocialIdentityVerifier'
    App\Authentication\Application\Port\TotpVerifier: '@App\Authentication\Infrastructure\Totp\OtphpTotp'
    App\Authentication\Application\Port\TotpProvisioner: '@App\Authentication\Infrastructure\Totp\OtphpTotp'
    App\Authentication\Domain\Policy\PasswordHasher: '@App\Authentication\Infrastructure\Crypto\Argon2idPasswordHasher'
    App\Authentication\Domain\Policy\TokenGenerator: '@App\Authentication\Infrastructure\Crypto\RandomTokenGenerator'
    App\Authentication\Domain\Policy\TokenHasher: '@App\Authentication\Infrastructure\Crypto\Sha256TokenHasher'
    App\Authentication\Domain\Policy\SecretEncrypter: '@App\Authentication\Infrastructure\Crypto\LibsodiumSecretEncrypter'
    App\Authentication\Contract\AccountLookup: '@App\Authentication\Application\ContractImplementation\AccountLookupFacade'
    App\Authentication\Contract\CurrentUser: '@App\Authentication\Infrastructure\Security\SecurityCurrentUser'
    App\Penalty\Contract\BlacklistChecker: '@App\Penalty\Application\ContractImplementation\AllowAllBlacklistChecker'

    App\Authentication\Domain\Policy\PasswordPolicy:
        arguments:
            $minLength: 10

    App\Authentication\Application\Port\AuthenticationSettings:
        arguments:
            $refreshTokenLifetime: 'P30D'
            $emailVerificationLifetime: 'PT24H'
            $passwordResetLifetime: 'PT1H'
            $expiredTokenRetention: 'P30D'

    App\Authentication\Application\Command\CreateAdminHandler:
        arguments:
            $defaultLocale: '%kernel.default_locale%'

    App\Authentication\Infrastructure\Crypto\Argon2idPasswordHasher:
        arguments:
            $memoryCostKib: '%auth.argon2.memory_kib%'
            $timeCost: '%auth.argon2.time_cost%'

    App\Authentication\Infrastructure\Crypto\LibsodiumSecretEncrypter:
        arguments:
            $base64Key: '%env(AUTH_ENCRYPTION_KEY)%'

    App\Authentication\Infrastructure\Jwt\JwtSettings:
        arguments:
            $privateKeyPath: '%auth.jwt.private_key_path%'
            $publicKeyPaths:
                '%auth.jwt.key_id%': '%auth.jwt.public_key_path%'
            $currentKeyId: '%auth.jwt.key_id%'
            $issuer: '%auth.jwt.issuer%'
            $audience: '%auth.jwt.audience%'

    App\Authentication\Infrastructure\Mail\SymfonyAuthEmailSender:
        arguments:
            $fromAddress: '%env(AUTH_MAIL_FROM_ADDRESS)%'
            $fromName: '%env(AUTH_MAIL_FROM_NAME)%'
            # The web app resolves both links (routes /verify-email and /reset-password); {token} is replaced by the token
            $verificationUrlTemplate: '%env(WEB_APP_URL)%/verify-email?token={token}'
            $resetUrlTemplate: '%env(WEB_APP_URL)%/reset-password?token={token}'

    App\Authentication\Infrastructure\Social\JwksSocialIdentityVerifier:
        arguments:
            $providers:
                google: '@auth.social.google'
                apple: '@auth.social.apple'

    auth.social.google:
        class: App\Authentication\Infrastructure\Social\SocialProviderSettings
        arguments:
            $jwksUrl: '%env(GOOGLE_JWKS_URL)%'
            $issuers: ['https://accounts.google.com', 'accounts.google.com']
            $audiences: ['%env(GOOGLE_CLIENT_ID)%']

    auth.social.apple:
        class: App\Authentication\Infrastructure\Social\SocialProviderSettings
        arguments:
            $jwksUrl: '%env(APPLE_JWKS_URL)%'
            $issuers: ['https://appleid.apple.com']
            $audiences: ['%env(APPLE_CLIENT_ID)%']

    # --- Event subscribers (event bus) ---
    authentication.processed_events:
        class: App\Authentication\Infrastructure\Persistence\AuthenticationProcessedEvents

    authentication.idempotent_handling:
        class: App\SharedKernel\Application\IdempotentHandling
        arguments:
            $processedEvents: '@authentication.processed_events'

    App\Authentication\Infrastructure\Messaging\RevokeSessionsOnPenaltySubscriber:
        arguments:
            $idempotent: '@authentication.idempotent_handling'
        tags:
            - { name: messenger.message_handler, bus: event.bus, handles: App\Penalty\Contract\Event\PenaltyEvent }

    # --- Rate limiter state lives in Postgres ---
    auth.rate_limiter_storage:
        alias: App\Authentication\Infrastructure\RateLimit\DbalRateLimiterStorage

    # --- Security ---
    App\Authentication\Infrastructure\Security\JwtAuthenticator: ~
    App\Authentication\Infrastructure\Security\ProblemEntryPoint: ~

when@test:
    parameters:
        auth.argon2.memory_kib: 8
        auth.argon2.time_cost: 1
        auth.rate_limit.login_ip: 100
        auth.rate_limit.login_email: 3
        auth.rate_limit.register_ip: 100
        auth.rate_limit.password_ip: 100
        auth.rate_limit.password_email: 2
        auth.rate_limit.email_ip: 100
        auth.rate_limit.email_email: 2
        auth.rate_limit.social_ip: 100
        auth.rate_limit.token_ip: 100
        auth.rate_limit.two_factor_account: 3
        auth.rate_limit.two_factor_ip: 100

    services:
        _defaults:
            autowire: true
            autoconfigure: true

        # Public so that application tests can swap them for in-memory implementations and fakes
        App\Authentication\Domain\Repository\UserAccountRepository:
            alias: App\Authentication\Infrastructure\Persistence\DoctrineUserAccountRepository
            public: true
        App\Authentication\Domain\Repository\RefreshTokenRepository:
            alias: App\Authentication\Infrastructure\Persistence\DoctrineRefreshTokenRepository
            public: true
        App\Authentication\Domain\Repository\OneTimeTokenRepository:
            alias: App\Authentication\Infrastructure\Persistence\DoctrineOneTimeTokenRepository
            public: true
        App\Authentication\Domain\Repository\TwoFactorSecretRepository:
            alias: App\Authentication\Infrastructure\Persistence\DoctrineTwoFactorSecretRepository
            public: true
        App\Authentication\Application\Port\AuthEmailSender:
            alias: App\Authentication\Infrastructure\Mail\SymfonyAuthEmailSender
            public: true
        App\Authentication\Application\Port\SocialIdentityVerifier:
            alias: App\Authentication\Infrastructure\Social\JwksSocialIdentityVerifier
            public: true
        App\Authentication\Application\Port\AccessTokenIssuer:
            alias: App\Authentication\Infrastructure\Jwt\JwtAccessTokenIssuer
            public: true
        App\Authentication\Application\Port\TotpVerifier:
            alias: App\Authentication\Infrastructure\Totp\OtphpTotp
            public: true
        authentication.processed_events:
            class: App\Authentication\Infrastructure\Persistence\AuthenticationProcessedEvents
            public: true
        App\Authentication\Contract\AccountLookup:
            alias: App\Authentication\Application\ContractImplementation\AccountLookupFacade
            public: true
        App\Authentication\Contract\CurrentUser:
            alias: App\Authentication\Infrastructure\Security\SecurityCurrentUser
            public: true
        App\Penalty\Contract\BlacklistChecker:
            alias: App\Penalty\Application\ContractImplementation\AllowAllBlacklistChecker
            public: true
        App\Authentication\Infrastructure\RateLimit\InMemoryLimiterStorage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage
        auth.rate_limiter_storage:
            alias: App\Authentication\Infrastructure\RateLimit\InMemoryLimiterStorage
