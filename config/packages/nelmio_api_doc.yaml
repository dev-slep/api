# API documentation is generated and served in dev (and test); the prod image does not ship the UI.
when@dev: &documentation
    nelmio_api_doc:
        documentation:
            openapi: '3.1.0'
            info:
                title: Slep API
                version: v1
                description: Backend API of Slep. Errors are RFC 9457 problem details (application/problem+json).
            servers:
                # Controllers declare full paths (/api/v1/...), so the server is the application root
                - url: /
                  description: Application root; every path already starts with /api/v1
            components:
                securitySchemes:
                    bearerAuth:
                        type: http
                        scheme: bearer
                        bearerFormat: JWT
                responses:
                    BadRequest:
                        description: The request could not be understood.
                        content:
                            application/problem+json:
                                schema:
                                    $ref: '#/components/schemas/ProblemDetails'
                    Unauthorized:
                        description: Missing, expired or invalid access token, or wrong credentials.
                        headers:
                            WWW-Authenticate:
                                description: The authentication scheme to use.
                                style: simple
                                explode: false
                                schema:
                                    type: string
                                    example: Bearer
                        content:
                            application/problem+json:
                                schema:
                                    $ref: '#/components/schemas/ProblemDetails'
                    Forbidden:
                        description: Authenticated, but not allowed to do this.
                        content:
                            application/problem+json:
                                schema:
                                    $ref: '#/components/schemas/ProblemDetails'
                    Conflict:
                        description: The request conflicts with the current state.
                        content:
                            application/problem+json:
                                schema:
                                    $ref: '#/components/schemas/ProblemDetails'
                    ValidationFailed:
                        description: The request body is malformed, fails validation (with the fields at fault in `errors`) or breaks a business rule.
                        content:
                            application/problem+json:
                                schema:
                                    anyOf:
                                        - $ref: '#/components/schemas/ValidationProblem'
                                        - $ref: '#/components/schemas/ProblemDetails'
                    TooManyRequests:
                        description: Rate limit exceeded.
                        headers:
                            Retry-After:
                                description: Seconds to wait before trying again.
                                style: simple
                                explode: false
                                schema:
                                    type: integer
                                    example: 30
                        content:
                            application/problem+json:
                                schema:
                                    $ref: '#/components/schemas/ProblemDetails'
                    ServiceUnavailable:
                        description: A third-party service this endpoint depends on is unavailable.
                        content:
                            application/problem+json:
                                schema:
                                    $ref: '#/components/schemas/ProblemDetails'
                schemas:
                    Money:
                        type: object
                        description: An amount in minor units of a currency.
                        required: [amount, currency]
                        properties:
                            amount:
                                type: integer
                                format: int64
                                example: 150000
                                description: Amount in minor units (e.g. para).
                            currency:
                                type: string
                                pattern: '^[A-Z]{3}$'
                                example: RSD
                                description: ISO 4217 currency code.
                    ProblemDetails:
                        type: object
                        description: RFC 9457 problem details.
                        required: [type, title, status]
                        properties:
                            type:
                                type: string
                                format: uri
                                example: 'https://slep.example/problems/not-found'
                            title:
                                type: string
                                example: Resource not found
                            status:
                                type: integer
                                example: 404
                            detail:
                                type: string
                            instance:
                                type: string
                                example: /api/v1/tow-requests/0190a1b2-c3d4-7e5f-8a6b-1c2d3e4f5a6b
                    ValidationProblem:
                        description: Problem details of a failed validation (422).
                        allOf:
                            - $ref: '#/components/schemas/ProblemDetails'
                            - type: object
                              required: [errors]
                              properties:
                                  errors:
                                      type: array
                                      items:
                                          type: object
                                          required: [field, message]
                                          properties:
                                              field:
                                                  type: string
                                                  example: price.amount
                                              message:
                                                  type: string
                                                  example: This value should be positive.
        areas:
            default:
                # Business endpoints only: excludes /api/doc, /health/* and the test fixtures (/api/v1/_test, /api/v1/admin/_test)
                path_patterns:
                    - ^/api/v1(?!/_test/|/admin/_test/)

when@test: *documentation
