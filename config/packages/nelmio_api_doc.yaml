# API documentation is generated and served in dev (and test); the prod image does not ship the UI.
when@dev: &documentation
    nelmio_api_doc:
        documentation:
            openapi: '3.1.0'
            info:
                title: Slep API
                version: v1
                description: Backend API of Slep. Errors are RFC 9457 problem details (application/problem+json).
            servers:
                # Controllers declare full paths (/api/v1/...), so the server is the application root
                - url: /
                  description: Application root; every path already starts with /api/v1
            components:
                securitySchemes:
                    bearerAuth:
                        type: http
                        scheme: bearer
                        bearerFormat: JWT
                schemas:
                    Money:
                        type: object
                        description: An amount in minor units of a currency.
                        required: [amount, currency]
                        properties:
                            amount:
                                type: integer
                                format: int64
                                example: 150000
                                description: Amount in minor units (e.g. para).
                            currency:
                                type: string
                                pattern: '^[A-Z]{3}$'
                                example: RSD
                                description: ISO 4217 currency code.
                    ProblemDetails:
                        type: object
                        description: RFC 9457 problem details.
                        required: [type, title, status]
                        properties:
                            type:
                                type: string
                                format: uri
                                example: 'https://slep.example/problems/not-found'
                            title:
                                type: string
                                example: Resource not found
                            status:
                                type: integer
                                example: 404
                            detail:
                                type: string
                            instance:
                                type: string
                                example: /api/v1/tow-requests/0190a1b2-c3d4-7e5f-8a6b-1c2d3e4f5a6b
                    ValidationProblem:
                        description: Problem details of a failed validation (422).
                        allOf:
                            - $ref: '#/components/schemas/ProblemDetails'
                            - type: object
                              required: [errors]
                              properties:
                                  errors:
                                      type: array
                                      items:
                                          type: object
                                          required: [field, message]
                                          properties:
                                              field:
                                                  type: string
                                                  example: price.amount
                                              message:
                                                  type: string
                                                  example: This value should be positive.
        areas:
            default:
                # Business endpoints only: excludes /api/doc, /health/* and the test fixtures
                path_patterns:
                    - ^/api/v1

when@test: *documentation
