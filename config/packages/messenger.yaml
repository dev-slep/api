framework:
    messenger:
        failure_transport: failed
        default_bus: command.bus

        buses:
            # Sync, one DB transaction per command: correlation -> audit -> transaction -> outbox
            command.bus:
                default_middleware:
                    enabled: true
                    allow_no_handlers: false
                    allow_no_senders: true
                middleware:
                    - App\SharedKernel\Infrastructure\Correlation\CorrelationMiddleware
                    - App\SharedKernel\Infrastructure\Messaging\AuditMiddleware
                    - App\SharedKernel\Infrastructure\Messaging\TransactionMiddleware
                    - App\SharedKernel\Infrastructure\Messaging\OutboxMiddleware
            # Sync, read-only, no transaction
            query.bus:
                default_middleware:
                    enabled: true
                    allow_no_handlers: false
                    allow_no_senders: true
            # Integration events: routed to the async transport; subscribers are added by modules
            event.bus:
                default_middleware:
                    enabled: true
                    allow_no_handlers: true
                    allow_no_senders: false
                middleware:
                    - App\SharedKernel\Infrastructure\Correlation\CorrelationMiddleware

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    table_name: messenger.messenger_messages
                    queue_name: default
                    auto_setup: false
                    use_notify: false
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 3
            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    table_name: messenger.messenger_messages
                    queue_name: failed
                    auto_setup: false
                    use_notify: false

        routing:
            # Commands and queries are not routed: they are handled synchronously
            'App\SharedKernel\Contract\IntegrationEvent': async

when@test:
    framework:
        messenger:
            transports:
                async:
                    retry_strategy:
                        max_retries: 2
                        delay: 1
                        multiplier: 1
